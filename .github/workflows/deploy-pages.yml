# Despliegue en GitHub Pages en cada push a main.
# Requisitos (una sola vez): Settings → Pages → Source: "GitHub Actions".
# Si se usa un dominio propio, define las variables del repositorio
# SITE_URL (https://tu-dominio.com) y BASE_PATH vacío.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build estático
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$SITE_URL" ]; then
            # Dominio propio: la subruta es la que se defina (normalmente vacía).
            export NEXT_PUBLIC_SITE_URL="$SITE_URL"
            export NEXT_PUBLIC_BASE_PATH="$BASE_PATH"
          else
            # Por defecto: https://<usuario>.github.io/<repo>
            owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            export NEXT_PUBLIC_BASE_PATH="/$REPO"
            export NEXT_PUBLIC_SITE_URL="https://$owner_lc.github.io/$REPO"
          fi
          echo "SITE_URL=$NEXT_PUBLIC_SITE_URL BASE_PATH=$NEXT_PUBLIC_BASE_PATH"
          npm run build
      - name: Evitar procesado Jekyll
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
